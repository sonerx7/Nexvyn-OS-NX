name: Bug in Nexvyn OS / Nexvyn OS'ta hata
description: Something in Nexvyn OS or a built-in app does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! English or Turkish is fine. / Teşekkürler! İngilizce ya da Türkçe yazabilirsiniz.
        If an App Market item is the problem, use the report form instead. / Sorun bir Uygulama Mağazası öğesindeyse
        bildirim formunu kullanın.
        Security problems: never here, see SECURITY.md. / Güvenlik sorunları: burada değil, SECURITY.tr.md'ye bakın.
  - type: input
    id: version
    attributes:
      label: Nexvyn OS version / sürümü
      description: System Settings > About / Sistem Ayarları > Hakkında
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: System version / Sistem sürümü
      description: System Settings > About, "System version" (required 22.5.0 or later) / Sistem Ayarları > Hakkında
      placeholder: "22.5.0"
    validations:
      required: true
  - type: input
    id: atmosphere
    attributes:
      label: Atmosphère version / Atmosphère sürümü
      description: System Settings > About / Sistem Ayarları > Hakkında
      placeholder: "1.12.1"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Where did it happen? / Nerede oldu?
      options:
        - Console, title mode / Konsol, başlık modu
        - Console, applet mode (Album) / Konsol, applet modu (Albüm)
        - Emulator / Emülatör
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Handheld or TV / El modu ya da TV
      options:
        - Handheld / El modu
        - TV (docked) / TV (dock'ta)
        - Both / İkisi de
  - type: input
    id: app
    attributes:
      label: App or part of the system / Uygulama ya da sistemin bölümü
      placeholder: Files, Browser, Quick Search, Dock...
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Hatayı oluşturma adımları
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect? / Ne oldu, ne bekliyordunuz?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log and crash report / Günlük ve çökme raporu
      description: |
        Attach or paste sdmc:/NexvynOS/System/Logs/system.log (and system.prev.log if you restarted since; lines that
        start with "stall" show freezes). Crash reports are in sdmc:/NexvynOS/System/Logs/Crashes, Atmosphère fatal
        reports in sdmc:/atmosphere/fatal_errors/. Remove anything private first. /
        sdmc:/NexvynOS/System/Logs/system.log dosyasını ekleyin ya da yapıştırın (yeniden başlattıysanız
        system.prev.log'u da; "stall" ile başlayan satırlar donmaları gösterir). Çökme raporları
        sdmc:/NexvynOS/System/Logs/Crashes, Atmosphère fatal raporları sdmc:/atmosphere/fatal_errors/ içindedir. Önce
        özel bilgileri silin.
      render: text
