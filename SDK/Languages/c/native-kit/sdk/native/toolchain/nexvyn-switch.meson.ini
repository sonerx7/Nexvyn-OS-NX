# Nexvyn native SDK: Meson cross file for devkitA64 + libnx.
#   meson setup build --cross-file <kit>/toolchain/nexvyn-switch.meson.ini
# DEVKITPRO is /opt/devkitpro inside the devkitPro shell and the CI image. Change the paths below if yours differs.
# Meson builds the ELF; make the .nro with `elf2nro app.elf app.nro --icon=icon.jpg --nacp=app.nacp`
# (nacptool --create "Title" "Author" "1.0.0" app.nacp), or use the CMake kit, which does it for you.

[constants]
dkp = '/opt/devkitpro'
arch = ['-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-ftls-model=local-exec', '-fPIE',
        '-ffunction-sections', '-fdata-sections', '-D__SWITCH__', '-I' + dkp / 'libnx/include',
        '-I' + dkp / 'portlibs/switch/include']

[binaries]
c = dkp / 'devkitA64/bin/aarch64-none-elf-gcc'
cpp = dkp / 'devkitA64/bin/aarch64-none-elf-g++'
ar = dkp / 'devkitA64/bin/aarch64-none-elf-gcc-ar'
strip = dkp / 'devkitA64/bin/aarch64-none-elf-strip'
pkg-config = dkp / 'portlibs/switch/bin/aarch64-none-elf-pkg-config'

[built-in options]
c_std = 'gnu11'
cpp_std = 'gnu++17'
optimization = '2'
c_args = arch
cpp_args = arch + ['-fexceptions', '-frtti']
c_link_args = ['-specs=' + dkp / 'libnx/switch.specs', '-fPIE', '-L' + dkp / 'libnx/lib',
               '-L' + dkp / 'portlibs/switch/lib']
cpp_link_args = c_link_args
default_library = 'static'

[properties]
needs_exe_wrapper = true
sys_root = dkp / 'portlibs/switch'

[host_machine]
system = 'horizon'
cpu_family = 'aarch64'
cpu = 'cortex-a57'
endian = 'little'
